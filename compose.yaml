services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--bind_ip", "127.0.0.1,localhost"]
    network_mode: host
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mongodb_data:
